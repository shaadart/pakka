# fly.toml app configuration file generated for pakka-api on 2026-11-24T22:02:38+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pakka-api'
primary_region = 'sin'

[build]
[env]
  ALLOWED_ORIGINS = 'https://pakka.madebyshaad.com'
  DATABASE_URL = 'sqlite:////data/app.db'
  ENABLE_FAILURE_SIMULATION = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
